name: Bump hdrneon

on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to bump to (default: latest)"
        required: false

permissions:
  contents: write

concurrency:
  group: bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update formula to the new release
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: scripts/bump-hdrneon.sh ${TAG:+"$TAG"}

      # Taps this checkout (working tree included), so the bumped formula is
      # what gets installed.
      - uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        if: steps.bump.outputs.changed == 'true'

      - name: Install and test
        if: steps.bump.outputs.changed == 'true'
        run: |
          brew install --formula porkloin/tap/hdrneon
          brew test porkloin/tap/hdrneon
          brew style porkloin/tap
          brew audit --formula --strict --online porkloin/tap/hdrneon

      - name: Commit
        if: steps.bump.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "hdrneon ${VERSION}"
          git push
